name: entropicmem
version: 3.0.0.dev0
description: "EntropicMem MemoryProvider for Hermes Agent — local durable facts, hybrid vault retrieval, and prefetch context injection."
author: Ufonik
# What register() wires: one MemoryProvider exposing 7 tools and 5 lifecycle
# hooks (declaration-time count must match the registrations). These two lists
# are the single declaration: the Hermes catalog review checks them against
# register(), so keep them exact. (A duplicate `hooks:` list was removed at the
# maintainer's request.)
provides_tools:
  - entropicmem_remember
  - entropicmem_search
  - entropicmem_update
  - entropicmem_forget
  - entropicmem_timeline
  - entropicmem_entity
  - entropicmem_profile
  - entropicmem_review
  - entropicmem_stats
provides_hooks:
  - on_memory_write
  - on_session_switch
  - on_session_end
  - on_turn_start
  - on_pre_compress
  - on_delegation
