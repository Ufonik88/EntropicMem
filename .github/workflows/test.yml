name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # fastapi + cryptography so the graph-server and encryption tests run
      # instead of importorskip-ing (they were silently untested in CI before).
      # pyyaml: the Hermes host always ships it, and without it _backend cannot
      # read config.yaml, so the EM-102 config-precedence tests fail.
      - run: pip install -q "pytest==9.0.3" "fastapi>=0.100,<1" "httpx>=0.27,<1" "cryptography>=41,<50" "pyyaml>=6,<7"
      - run: pytest -q tests/

  # EM-007: run the ci eval suite and compare against the committed baseline.
  # Fails on any gated regression per §6.3 (recall@5, ndcg@5, abstain_correct,
  # noise_rate, must_not_ok). The threshold warnings documented in §2.4 are
  # informational pre-2.8.0 and do not fail the job (they xfail the whole suite).
  evals-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "pytest==9.0.3" "fastapi>=0.100,<1" "httpx>=0.27,<1" "cryptography>=41,<50"
      # The ci suite forces sentence_transformers/torch OFF (sys.meta_path
      # blocker + engine flag), so no ML deps are needed here.
      - run: PYTHONPATH="plugins/entropicmem/scripts" python3 -m evals run --suite ci --adapter v2 --compare evals/baselines/v2.8.0-ci.json

  # EM-007: performance smoke test — 1k corpus, fail if prefetch warm p95
  # exceeds 2× the §6.4 prefetch-hit budget (10 ms → 20 ms p95).
  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "pytest==9.0.3" "fastapi>=0.100,<1" "httpx>=0.27,<1" "cryptography>=41,<50"
      - run: PYTHONPATH="plugins/entropicmem/scripts" python3 -m evals.perf --sizes 1000 --probes 5 --out-dir /tmp
      - name: Assert perf budget
        run: |
          python3 - <<'PY'
          import glob, json, os
          # perf.py writes perf-<UTC stamp>.json to --out-dir (/tmp)
          files = sorted(glob.glob("/tmp/perf-*.json"), key=os.path.getmtime)
          assert files, "no perf results found in /tmp"
          # report structure: report["results"]["<size>"]["prefetch"]["warm"]["p95_ms"]
          report = json.load(open(files[-1]))
          # Use the 1k corpus result (perf-smoke runs --sizes 1000)
          warm = report["results"]["1000"]["prefetch"]["warm"]["p95_ms"]
          budget = 20.0  # 2× §6.4 budget of 10 ms (CI 2x slack already baked in)
          assert warm <= budget, f"prefetch warm p95 {warm}ms exceeds {budget}ms budget (§6.4 × 2)"
          print("perf-smoke OK:", warm, "ms")
          PY

  # Windows import smoke (EM-007) + portable store tests (EM-202).
  # EM-202: Windows is a supported platform. The job is blocking: it imports
  # the modules that used to hard-import fcntl and runs the portable store
  # tests (locking, db, concurrency AC) on windows-latest.
  windows-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "pytest==9.0.3"
      - run: python -c "import memory_engine, entropicmem"
        env:
          PYTHONPATH: plugins/entropicmem/scripts
      - run: python -m pytest tests/unit -q
        env:
          PYTHONPATH: plugins/entropicmem/scripts

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH="plugins/entropicmem/scripts" python3 benchmarks/run_recall_bench.py
      - name: Assert recall floor
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("benchmarks/last_run.json"))
          assert d["precision_at_5"] >= 0.50, d
          assert d["mean_reciprocal_rank"] >= 0.50, d
          print("bench floor OK:", d["precision_at_5"], d["mean_reciprocal_rank"])
          PY

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `hermes plugins validate` is not on PyPI yet (0.19.0 predates it), and
      # the hermes-agent package refuses wheel/sdist builds (installer/Docker/Nix
      # distribution). Install the toolchain from a pinned commit as an editable
      # install, the supported dev path (bump the commit as needed).
      - run: |
          git clone --quiet https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout --quiet defb7033ff4e4507d38d769d20e406300f6a8790
          pip install -q uv
          uv pip install --system -e /tmp/hermes-agent
      # Exact command the Hermes plugin catalog runs at the pinned plugin SHA.
      - run: hermes plugins validate --install-deps plugins/entropicmem

  # Commit-identity guard. Fails when any commit in range carries an author or
  # committer email that is not a noreply address.
  #
  # The push-to-main trigger is the important one: a GitHub web merge only
  # creates its merge commit AFTER CI has run on the PR, so the PR check cannot
  # see it. On 2026-09-26 five public merge commits on main were authored with a
  # personal work email (GitHub takes the merge author from the merging
  # account's email, not the repo's git config) and repairing that required
  # rewriting published history. See scripts/check_commit_identity.sh.
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base history to compute base..head on a pull_request, and
          # the before/after range on a push. fetch-depth: 0 is the safe default.
          fetch-depth: 0
      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "range=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # before can be all-zeros on the first push to a new branch.
            BEFORE="$BEFORE_SHA"
            if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            echo "range=$BEFORE..$AFTER_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Check every commit is authored/committed by a noreply address
        run: scripts/check_commit_identity.sh "${{ steps.range.outputs.range }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "ruff==0.16.2"
      - run: ruff check skills/ plugins/ scripts/ tests/ benchmarks/ evals/
