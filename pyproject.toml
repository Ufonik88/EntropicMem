[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropicmem"
dynamic = ["version"]
description = "Standalone agent memory system for Hermes Agent — SQLite FTS5 memory engine, Markdown vault, visual graph, and a 34-command knowledge loop."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ufonik", email = "Ufonik88@users.noreply.github.com"},
]
keywords = ["agent", "memory", "hermes", "knowledge", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3,<2",
]
graph = ["graphviz>=0.20"]
security = ["cryptography>=41.0.0"]
serve = ["fastapi>=0.100,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/Ufonik88/EntropicMem"
Repository = "https://github.com/Ufonik88/EntropicMem"
Issues = "https://github.com/Ufonik88/EntropicMem/issues"
Changelog = "https://github.com/Ufonik88/EntropicMem/blob/main/CHANGELOG.md"

# EM-201: the version's single source of truth is em/__init__.py. The engine
# lives under plugins/entropicmem/scripts/ so the plugin directory stays
# self-contained for catalog installs; package-dir maps that root for both
# the dynamic-version lookup and wheel packaging. Full packaging (entry
# points, extras layout) is EM-806.
[tool.setuptools]
package-dir = {"" = "plugins/entropicmem/scripts"}
packages = ["em", "em.formation", "em.jobs", "em.store", "em.store.migrations"]

[tool.setuptools.dynamic]
version = {attr = "em.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/entropicmem/scripts"]
markers = [
    "slow: FP measurement harness (aggregate-only, run with -m slow)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Explicit first-party source: without this, ruff auto-detects src from
# directories at the repo root, so the presence/absence of the generated
# graph_export/ output dir (gitignored) silently changes import
# categorization and breaks CI lint on fresh checkouts.
src = ["plugins/entropicmem/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test files bootstrap sys.path before importing scripts-dir modules —
# imports after the bootstrap are intentionally not at top of file.
"tests/*" = ["E402"]
